openapi: 3.0.3
info:
  title: SnapPwd Service API
  description: |
    A secure, ephemeral secret and file sharing service. Data is stored encrypted
    in Redis with automatic expiration and one-time access semantics - secrets and
    files are deleted immediately after retrieval.
  version: 1.0.0
  contact:
    name: OpenClaw

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /v1/secrets:
    post:
      summary: Create a secret
      description: Store an encrypted secret with time-based expiration. Writes are rate limited and may require a configured bearer token.
      security:
        - {}
        - WriteToken: []
      operationId: createSecret
      tags:
        - Secrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretRequest'
      responses:
        '200':
          description: Secret created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '400':
          description: Invalid expiration time, notification email, or encrypted secret exceeds 1572864 UTF-8 bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid JSON field type, request shape, or secret metadata (including the 4096-byte serialized metadata cap)
        '401':
          description: Missing or invalid write token when WRITE_API_TOKEN is configured
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '429':
          description: Combined per-IP write allowance exhausted
          headers:
            Retry-After:
              description: Seconds until the write allowance resets
              schema:
                type: integer
        '503':
          description: Storage capacity exhausted, Redis unavailable, or sender notification requested but SMTP is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: JSON request body exceeds 2097152 bytes (2 MiB)

  /v1/secrets/{id}:
    get:
      summary: Retrieve a secret
      description: |
        Retrieve a secret. By default, the secret is deleted after retrieval (one-time access).
        Use `?peek=true` to view metadata without burning the secret.
        When the sender asked for a reveal notification, a one-time retrieval
        emails them the caller's IP address and `User-Agent`. A frontend holding
        `CLIENT_INFO_TOKEN` may describe its visitor instead by sending
        `X-Client-Info-Token` with `X-Client-IP`, `X-Client-User-Agent` and
        optionally `X-Client-Location`; these headers are ignored otherwise.
      operationId: getSecret
      tags:
        - Secrets
      parameters:
        - name: id
          in: path
          required: true
          description: Secret ID (must start with "sps-")
          schema:
            type: string
            example: sps-7Yx8kN2mPqRs
        - name: peek
          in: query
          required: false
          description: |
            If true, returns metadata (creation time, TTL, custom metadata) without
            deleting the secret. The secret remains available for future access.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: |
            Secret retrieved successfully. Response format depends on the `peek` parameter:
            - `peek=false` (default): Returns the encrypted secret (secret is now deleted)
            - `peek=true`: Returns metadata only (secret is preserved)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EncryptedSecretResponse'
                  - $ref: '#/components/schemas/SecretPeekResponse'
        '404':
          description: Secret not found or already accessed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/files:
    post:
      summary: Create a file
      description: Store an encrypted file with metadata and time-based expiration. Writes are rate limited and may require a configured bearer token.
      security:
        - {}
        - WriteToken: []
      operationId: createFile
      tags:
        - Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileRequest'
      responses:
        '200':
          description: File created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          description: Invalid request (expiration out of range or file too large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid JSON field type or request shape
        '401':
          description: Missing or invalid write token when WRITE_API_TOKEN is configured
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '429':
          description: Combined per-IP write allowance exhausted
          headers:
            Retry-After:
              description: Seconds until the write allowance resets
              schema:
                type: integer
        '503':
          description: Storage capacity exhausted, Redis unavailable, or sender notification requested but SMTP is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured transport limit
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/files/{id}:
    get:
      summary: Retrieve a file
      description: |
        Retrieve a file. By default, the file is deleted after retrieval (one-time access).
        Use `?peek=true` to view metadata without burning the file.
        When the sender asked for a reveal notification, a one-time retrieval
        emails them the caller's IP address and `User-Agent`. A frontend holding
        `CLIENT_INFO_TOKEN` may describe its visitor instead by sending
        `X-Client-Info-Token` with `X-Client-IP`, `X-Client-User-Agent` and
        optionally `X-Client-Location`; these headers are ignored otherwise.
      operationId: getFile
      tags:
        - Files
      parameters:
        - name: id
          in: path
          required: true
          description: File ID (must start with "spf-")
          schema:
            type: string
            example: spf-9Zw3mK7nPqTs
        - name: peek
          in: query
          required: false
          description: |
            If true, returns metadata (creation time, TTL, file metadata) without
            deleting the file. The file remains available for future access.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: |
            File retrieved successfully. Response format depends on the `peek` parameter:
            - `peek=false` (default): Returns the full file with encrypted data (file is now deleted)
            - `peek=true`: Returns metadata only (file is preserved)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StoredFile'
                  - $ref: '#/components/schemas/FilePeekResponse'
        '404':
          description: File not found or already accessed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    WriteToken:
      type: http
      scheme: bearer
      description: Required for writes only when WRITE_API_TOKEN is configured; otherwise writes are public.
  schemas:
    SecretRequest:
      type: object
      required:
        - encryptedSecret
        - expiration
      properties:
        encryptedSecret:
          type: string
          maxLength: 1572864
          description: |
            The encrypted secret data. Maximum UTF-8 size after JSON decoding is
            1572864 bytes (1.5 MiB), including any base64/encryption envelope.
            The complete JSON request body is limited to 2097152 bytes (2 MiB).
          example: "U2FsdGVkX1+vupppZksvRf5pq5g5XjFRlipGLw=="
        expiration:
          type: integer
          format: int64
          minimum: 60
          maximum: 2592000
          description: Time in seconds until the secret expires (1 minute to 30 days)
          example: 3600
        senderEmail:
          type: string
          format: email
          maxLength: 254
          nullable: true
          description: |
            Optional single bare ASCII address for a best-effort notification after
            one-time retrieval. Trimmed; blank/null/omitted disables notifications.
            Stored privately until retrieval or expiration, never returned by peek.
            Requires configured SMTP; otherwise creation returns 503.
          example: sender@example.com
        metadata:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SecretMetadata'
          description: |
            Optional secret metadata. Metadata is not encrypted with the secret value
            and can be returned by `GET /v1/secrets/{id}?peek=true`.
          example:
            label: API key for staging
            intendedRecipient: ops@example.com
            rotateBy: "2026-05-01"

    SecretMetadata:
      type: object
      additionalProperties: false
      description: |
        Optional, unencrypted metadata for a secret. Metadata values must be
        strings; leading and trailing whitespace is trimmed, and empty values are
        dropped. Metadata is not encrypted with the secret value and can be
        returned by `GET /v1/secrets/{id}?peek=true`. After normalization, the
        complete serialized metadata object must be at most 4096 bytes (4 KiB),
        including JSON keys and escaping. Consumers must escape metadata for the
        rendering context; these strings are untrusted input, not safe HTML.
      properties:
        label:
          type: string
          maxLength: 120
          description: Short user-facing label. Maximum accepted UTF-8 length is 120 bytes.
          example: API key for staging
        intendedRecipient:
          type: string
          maxLength: 254
          description: Recipient hint such as an email address or team name. Maximum accepted UTF-8 length is 254 bytes.
          example: ops@example.com
        note:
          type: string
          maxLength: 1000
          description: Optional note about the secret. Maximum accepted UTF-8 length is 1000 bytes.
          example: Rotate after staging rollout.
        rotateBy:
          type: string
          maxLength: 64
          description: Optional rotation deadline or date hint. Maximum accepted UTF-8 length is 64 bytes.
          example: "2026-05-01"
        rotationReason:
          type: string
          maxLength: 240
          description: Optional reason this secret should be rotated. Maximum accepted UTF-8 length is 240 bytes.
          example: staging cutover
        shareType:
          type: string
          maxLength: 64
          description: Optional client-defined share type. Maximum accepted UTF-8 length is 64 bytes.
          example: password

    SecretResponse:
      type: object
      required:
        - secretId
      properties:
        secretId:
          type: string
          description: Unique identifier for retrieving the secret
          pattern: ^sps-[A-Za-z0-9]+$
          example: sps-7Yx8kN2mPqRs

    EncryptedSecretResponse:
      type: object
      required:
        - encryptedSecret
      properties:
        encryptedSecret:
          type: string
          description: The retrieved encrypted secret
          example: "U2FsdGVkX1+vupppZksvRf5pq5g5XjFRlipGLw=="

    SecretPeekResponse:
      type: object
      required:
        - createdAt
        - ttlSeconds
      properties:
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp when the secret was created (0 for legacy secrets)
          example: 1706900000
        ttlSeconds:
          type: integer
          format: int64
          description: Remaining time-to-live in seconds (-1 if no expiration, -2 if key doesn't exist)
          example: 298
        metadata:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SecretMetadata'
          description: |
            Secret metadata stored with the secret. Metadata is not encrypted with
            the secret value and can be returned by peek. Null for legacy secrets;
            older stored secrets may return legacy metadata shapes.
          example:
            label: API key for staging

    FileMetadata:
      type: object
      required:
        - originalFilename
        - contentType
        - iv
      properties:
        originalFilename:
          type: string
          description: Untrusted original filename. Consumers must escape it for the rendering context.
          example: document.pdf
        contentType:
          type: string
          description: MIME type of the file
          example: application/pdf
        iv:
          type: string
          description: Initialization vector for encryption
          example: "abc123def456"

    FileRequest:
      type: object
      required:
        - metadata
        - encryptedData
        - expiration
      properties:
        senderEmail:
          type: string
          format: email
          maxLength: 254
          nullable: true
          description: |
            Optional private notification address, with the same validation and
            best-effort delivery semantics as SecretRequest.senderEmail.
            Expires with the file; never returned in peek or retrieval responses.
            Requires configured SMTP; otherwise creation returns 503.
        metadata:
          $ref: '#/components/schemas/FileMetadata'
        encryptedData:
          type: string
          description: Base64-encoded encrypted file content
          example: "SGVsbG8gV29ybGQh..."
        expiration:
          type: integer
          format: int64
          minimum: 60
          maximum: 2592000
          description: Time in seconds until the file expires (1 minute to 30 days)
          example: 3600

    FileResponse:
      type: object
      required:
        - fileId
      properties:
        fileId:
          type: string
          description: Unique identifier for retrieving the file
          pattern: ^spf-[A-Za-z0-9]+$
          example: spf-9Zw3mK7nPqTs

    StoredFile:
      type: object
      required:
        - metadata
        - encryptedData
      properties:
        metadata:
          $ref: '#/components/schemas/FileMetadata'
        encryptedData:
          type: string
          description: Base64-encoded encrypted file content
          example: "SGVsbG8gV29ybGQh..."

    FilePeekResponse:
      type: object
      required:
        - createdAt
        - ttlSeconds
        - metadata
      properties:
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp when the file was created (0 for legacy files)
          example: 1706900000
        ttlSeconds:
          type: integer
          format: int64
          description: Remaining time-to-live in seconds (-1 if no expiration, -2 if key doesn't exist)
          example: 298
        metadata:
          $ref: '#/components/schemas/FileMetadata'

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message describing what went wrong
          example: "Invalid expiration: must be between 60 and 2592000 seconds"

tags:
  - name: Secrets
    description: One-time secret sharing endpoints
  - name: Files
    description: One-time file sharing endpoints
